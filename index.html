<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1c16">
<meta name="description" content="Wobz — premium document and file workspace with a Render processing backend.">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<title>Wobz — Document Workspace</title>
</head>
<body>
<a class="skip-link" href="#workspace">Skip to workspace</a>
<div id="app" class="boot"><div class="boot-mark">W</div><p>Starting Wobz workspace…</p></div>
<div id="layer-modal" class="layer" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="sr" class="sr-only" aria-live="polite"></div>
<noscript>Wobz needs JavaScript to run.</noscript>
<script>window.WOBZ_CONFIG={apiBase:'/api'};</script>
<script src="/app.js" defer></script>
</body>
</html>
