
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B192C">
  <meta name="description" content="KrazyBuy — document and file workspace for PDFs, documents, spreadsheets, images and archives.">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/logo.png">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <title>KrazyBuy — Document & File Workspace</title>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <div id="app" class="boot">
    <div class="boot-mark"><img src="/images/logo.svg" alt="KrazyBuy"></div>
    <p>Starting KrazyBuy…</p>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="sr" class="sr-only" role="status" aria-live="polite"></div>
  <script>
    window.KRAZYBUY_CONFIG = {
      apiBase: "/api",
      renderApiBase: "https://wobz-ver-1-1.onrender.com/api",
      requestTimeoutMs: 180000,
      healthTimeoutMs: 10000,
      maxFileMB: 200
    };
  </script>
  <script src="/app.js" defer></script>
</body>
</html>
